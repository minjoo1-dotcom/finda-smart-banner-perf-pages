const KEY = 'sbp_pw';
const u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw) {
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: u8(P.salt), iterations: P.iter, hash: 'SHA-256' },
    km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(P.iv) }, key, u8(P.ct));
  return new TextDecoder().decode(pt);
}
async function open_(pw, silent) {
  const btn = document.getElementById('btn'), err = document.getElementById('err');
  btn.disabled = true; err.textContent = silent ? '' : '확인 중…';
  try {
    const html = await unlock(pw);
    sessionStorage.setItem(KEY, pw);
    document.open(); document.write(html); document.close();
  } catch (e) {
    sessionStorage.removeItem(KEY);
    err.textContent = silent ? '' : '비밀번호가 올바르지 않습니다.';
    btn.disabled = false;
  }
}
document.getElementById('f').addEventListener('submit', e => {
  e.preventDefault();
  open_(document.getElementById('pw').value, false);
});
const saved = sessionStorage.getItem(KEY);
if (saved) open_(saved, true);
